<script>
async function searchGame(){

    const url =
    "https://opencritic-api.p.rapidapi.com/game/search?criteria=the%20witcher%203";

    const options = {

        method:"GET",

        headers:{

            "x-rapidapi-key":"YOUR KEY",

            "x-rapidapi-host":"opencritic-api.p.rapidapi.com"

        }

    };

    try{

        const response=await fetch(url,options);

        const result=await response.json();

        console.log(result);

    }

    catch(error){

        console.error(error);

    }

}

searchGame();



</script>
