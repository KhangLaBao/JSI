<!DOCTYPE html>
<html>

<head>

<title>Redirecting...</title>

<meta http-equiv="refresh" content="5;url=index.html">

<style>

body{

    background:#C0C0C0;

    font-family:Tahoma, Arial;

    font-size:12px;

    color:#000;

    margin-top:80px;

    text-align:center;

}

.box{

    width:420px;

    margin:auto;

    background:#FFFFFF;

    border:2px outset #C0C0C0;

    padding:20px;

}

h2{

    margin-top:0;

    font-size:16px;

    color:#000080;

}

</style>

<script>

var seconds = 0;

function countdown(){

    document.getElementById("count").innerHTML = seconds;

    if(seconds <= 0){

        window.location.href = "/index.html";

    }else{

        seconds--;

        setTimeout(countdown,1000);

    }

}

window.onload = countdown;

</script>

</head>

<body>

<div class="box">

<h2>Redirecting...</h2>

<p>

The page you requested has moved.

</p>

<p>

You will be redirected to the homepage in
<b><span id="count">0</span></b>
seconds.

</p>

<p>

If your browser does not redirect automatically,

<a href="index.html">click here</a>.

</p>

<hr>

<small>

Gamepedia AI © 2026

</small>

</div>

</body>

</html>
