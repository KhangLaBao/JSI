 <header class="navbar">

      <section class="card auth-card">
        <div class="eyebrow">Đăng nhập</div>

        <form class="form" id="loginForm">
          <label>
            Email
            <input name="email" type="email" placeholder="you@example.com" required />
          </label>

          <label>
            Mật khẩu
            <input name="password" type="password" placeholder="••••••••" required />
          </label>

          <div id="loginMessage" class="form-message" aria-live="polite"></div>
          <button class="btn btn-primary btn-full" type="submit">Đăng nhập</button>
          <button onclick="window.location.href='register.html';">Hoặc nếu không có tài khoản, Đăng kí</button>

          
        
          </div>
        </form>
