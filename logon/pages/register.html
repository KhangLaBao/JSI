
<!doctype html>

<head>
  <meta charset="utf-8" />

  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="icon" type="image/png" href="../../favicon.png">
</head>
<body data-page="register">

 <header class="navbar">

    <div class="logo">
        <img src="../../images/logo.png" alt="Logo">
    </div>

    <nav class="nav-links">

        <a href="../../index.html">Trang chủ</a>

        <a href="../../games.html">Trò Chơi</a>

        <a href="../../search.html">Trình Tìm Kiếm</a>

        <a href="../../reviews.html">Đánh Giá</a>

        <a href="../../help.html">Trợ giúp bằng trí tuệ nhân tạo</a>

    </nav>

<div class="auth-actions" data-auth-actions></div>

<style>
  body {
    background-image: url('../../images/image1.jpg');
    background-repeat: no-repeat; /* Prevents the image from repeating */
    background-size: cover;      /* Forces image to cover the entire screen */
  }
</style>
</header>


      <section class="card auth-card">
        <div class="eyebrow">Bước 2 · Đăng ký</div>
        <h1>Tạo tài khoản Gamepedia AI</h1>


        <form class="form" id="registerForm">
          <label>
            Email
            <input name="email" type="email" placeholder="you@example.com" required />
          </label>
          <div class="tiny">Email phải hợp lệ.</div>

          <label>
            Mật khẩu
            <input name="password" type="password" minlength="6" placeholder="Ít nhất 6 ký tự" required />
          </label>
          <div class="tiny">Mật khẩu tối thiểu 6 ký tự.</div>

          <label>
            Nhập lại mật khẩu
            <input name="confirmPassword" type="password" minlength="6" placeholder="Nhập lại mật khẩu" required />
          </label>

          <div id="registerMessage" class="form-message" aria-live="polite"></div>
          <button class="btn btn-primary btn-full" type="submit">Đăng ký</button>
           <button onclick="window.location.href='login.html';">Nêu đã có tài khoản, Đăng nhập</button>
    
        </form>
      </section>
    </main>
  </div>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
